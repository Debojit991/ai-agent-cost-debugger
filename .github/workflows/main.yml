name: AI Agent Cost Debugger CI/CD Pipeline

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Typecheck & Build Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js v22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install & Typecheck Backend
        run: |
          cd backend
          npm ci || npm install
          npx tsc --noEmit

      - name: Install & Typecheck Frontend
        run: |
          cd frontend
          npm ci || npm install
          npx tsc --noEmit
          npm run build

  deploy-staging:
    name: Deploy to Staging (Render & Vercel)
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js v22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Deploy Backend to Render Staging
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          echo "=== Deploying Backend to Render Staging ==="
          if [ -n "$RENDER_DEPLOY_HOOK_URL" ]; then
            curl -X POST "$RENDER_DEPLOY_HOOK_URL"
          else
            echo "RENDER_DEPLOY_HOOK_URL not configured. Skipping deploy trigger."
          fi

      - name: Deploy Frontend to Vercel Staging
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          echo "=== Deploying Frontend to Vercel Staging ==="
          if [ -n "$VERCEL_TOKEN" ]; then
            cd frontend
            npx vercel pull --yes --environment=preview --token=$VERCEL_TOKEN
            npx vercel build --token=$VERCEL_TOKEN
            npx vercel deploy --prebuilt --token=$VERCEL_TOKEN
          else
            echo "VERCEL_TOKEN not configured. Skipping Vercel deploy."
          fi
